name: livingseed_bookstore
description: "Living Seed Bookstore."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  provider: ^6.1.4
  shared_preferences: ^2.5.3
  loading_animation_widget: ^1.3.0
  flutter_svg: ^2.0.17
  percent_indicator: ^4.2.4
  dio: ^5.8.0+1
  flutter_pdfview: ^1.4.0
  iconsax: ^0.0.8
  file_picker: ^9.2.3
  pdf: ^3.11.3
  path_provider: ^2.1.5
  syncfusion_flutter_calendar: ^29.1.33
  carousel_slider: ^5.0.0
  image_picker: ^1.1.2
  choice: ^2.3.2
  collection: ^1.19.0
  just_audio: ^0.10.5
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
    - assets/pdfs/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.ttf
        - asset: assets/fonts/Satoshi-Light.ttf
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
